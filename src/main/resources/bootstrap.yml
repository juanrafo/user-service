spring:
  application:
    name: user-service
  cloud:
    config:
      uri: http://host.docker.internal:9000
      profile: dev
      enabled: true

management:
  endpoint:
    health:
      validate-group-membership: false

eureka:
  client:
    register-with-eureka: true
    service-url:
      defaultZone: http://host.docker.internal:8761/eureka